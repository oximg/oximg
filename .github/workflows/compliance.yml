name: License Compliance

# Both checks read only the Cargo dependency tree, which site/ is not
# part of.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]
  # Advisories land on their own schedule; a quiet repo must still
  # hear about them.
  schedule:
    - cron: "17 6 * * *"

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-about is pinned: its output must match the committed
      # THIRD-PARTY-LICENSES.md byte-for-byte, and 0.9.2 re-picked
      # license files across the tree, turning a tool update into a
      # red build with no repo change. Bump it together with a
      # regeneration. cargo-deny deliberately floats — hearing about
      # new advisories is its job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about@0.9.2
      # Policy gate: no copyleft, no known-vulnerable crates, source hygiene.
      - name: cargo deny
        run: cargo deny check
      # Attribution bundle must stay in sync with the dependency tree.
      # `--features avif`: the Docker image ships the avif build. One
      # bundle serves every artifact, and a notice for a crate that an
      # artifact does not use does no harm.
      - name: THIRD-PARTY-LICENSES up to date
        run: |
          cargo about generate --features avif about.hbs -o /tmp/THIRD-PARTY-LICENSES.md
          if ! diff -u THIRD-PARTY-LICENSES.md /tmp/THIRD-PARTY-LICENSES.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Run, with cargo-about 0.9.2: cargo about generate --features avif about.hbs -o THIRD-PARTY-LICENSES.md"
            exit 1
          fi
